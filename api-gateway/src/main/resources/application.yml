server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Every route runs AuthFilter, which decides per method + path whether a JWT is needed
        # (see gateway.public-paths / gateway.public-read-paths below) and always strips
        # client-supplied X-User-* headers before forwarding.
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - AuthFilter

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**,/api/v1/admin/users/**
          filters:
            - AuthFilter

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**
          filters:
            - AuthFilter

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**,/api/v1/admin/orders/**,/api/v1/payments/**
          filters:
            - AuthFilter

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - AuthFilter

# JWT secret — must match user-service secret
jwt:
  secret: ${JWT_SECRET}

gateway:
  # No JWT needed for any method
  public-paths:
    - /api/v1/auth/
    - /actuator
    # Stripe webhook: authenticated by its signature, not a JWT
    - /api/v1/payments/webhook
  # No JWT needed for GET/HEAD/OPTIONS only (browsing); writes always require a valid token
  public-read-paths:
    - /api/v1/products
    - /api/v1/categories
    - /api/v1/inventory

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health, info, gateway
