server:
  port: ${PORT:8080}

spring:
  threads:
    virtual:
      enabled: true
  main:
    allow-bean-definition-overriding: true
  application:
    name: shopflow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopflow_db}
    username: ${SPRING_DATASOURCE_USERNAME:shopflow}
    password: ${SPRING_DATASOURCE_PASSWORD:shopflow123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 1000
        request.timeout.ms: 1000
        delivery.timeout.ms: 2000
    consumer:
      group-id: shopflow-monolith-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # JSON is mapped onto listener parameter types by the JsonMessageConverter bean
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 604800000

kafka:
  topics:
    user-registered: user.registered
    order-created: order.created
    inventory-reserved: inventory.reserved
    inventory-failed: inventory.failed
    order-confirmed: order.confirmed
    order-cancelled: order.cancelled
    inventory-release: inventory.release

shopflow:
  kafka:
    # Orders are fulfilled in-process (SyncOrderFulfillmentService). Kafka events are still
    # published for external consumers, but the saga listeners stay off to avoid double work.
    listeners-enabled: ${KAFKA_LISTENERS_ENABLED:false}

resend:
  api-key: ${RESEND_API_KEY:}

inventory:
  stock:
    cache-ttl-seconds: 600

eureka:
  client:
    enabled: false


management:
  endpoints:
    web:
      exposure:
        include: health, info

# Admin account bootstrap — no default password; skipped when ADMIN_PASSWORD is unset
admin:
  email: ${ADMIN_EMAIL:admin@shopflow.com}
  password: ${ADMIN_PASSWORD:}

# Stripe payments — optional. Without both keys, orders are confirmed automatically (no payment step).
payments:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  unpaid-timeout-minutes: ${UNPAID_ORDER_TIMEOUT_MINUTES:35}
