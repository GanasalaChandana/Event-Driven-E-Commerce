name: Keep backend awake

# Render's free tier sleeps after ~15 minutes without traffic, and the first request then takes up to
# a minute. This pings the health endpoint every 10 minutes during daytime hours only
# (13:00–03:59 UTC, about 8am–10pm US Central). An always-on instance uses ~744 of the 750 free
# instance-hours per month, and the free hours are shared by every free service in the workspace,
# so keeping it up 24/7 can suspend the service near the end of the month.
on:
  schedule:
    - cron: "*/10 13-23,0-3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" --max-time 120 --retry 2 --retry-delay 10 \
            https://event-driven-e-commerce.onrender.com/actuator/health || true
