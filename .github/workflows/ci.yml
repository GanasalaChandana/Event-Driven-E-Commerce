name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Builds and tests every module (gateway, each microservice, and the monolith)
      - name: Build & test
        shell: bash
        run: |
          set -o pipefail
          mvn -B verify --no-transfer-progress 2>&1 | tee build.log || status=$?
          # Surface compiler / test errors as annotations so they show up on the run summary
          grep -E "^\[ERROR\]|FAIL" build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          exit ${status:-0}
        env:
          RESEND_API_KEY: test-key
          JWT_SECRET: test-secret-key-for-ci-at-least-256-bits-long-padding

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopflow-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: shopflow-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://event-driven-e-commerce.onrender.com
